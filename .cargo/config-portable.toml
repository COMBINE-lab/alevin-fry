# inspired by https://curiouscoding.nl/posts/release-flow/#avx2

# .cargo/config-portable.toml
#
# .github/build-setup.yml copies this file over .cargo/config.toml for
# cargo-dist builds, so anything config.toml needs at build time has to be
# duplicated here or it is silently lost in release artifacts.

[env]
# libdeflate 1.25 can generate AVX-VNNI assembly that older system assemblers
# cannot parse. Its CMake build probes this, but libdeflate-sys builds through
# cc-rs, so set the same compatibility define for Cargo builds.
CFLAGS = { value = "-DLIBDEFLATE_ASSEMBLER_DOES_NOT_SUPPORT_AVX_VNNI", force = false }

[target.x86_64-unknown-linux-gnu]
rustflags = ["-C", "target-cpu=x86-64-v3", "-C", "target-feature=+avx2"]

[target.aarch64-unknown-linux-gnu]
rustflags = ["-C", "target-cpu=neoverse-n1"]

[target.aarch64-apple-darwin]
rustflags = ["-C", "target-cpu=apple-a14"]

[target.x86_64-apple-darwin]
rustflags = ["-C", "target-cpu=x86-64-v3", "-C", "target-feature=+avx2"]
