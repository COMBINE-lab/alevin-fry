[package]
authors = [
  "Avi Srivastava <asrivastava@wistar.org>",
  "Hirak Sarkar <hiraksarkar.cs@gmail.com>",
  "Dongze He <dhe17@umd.edu>.zakeri@gmail.com>",
  "Noor Pratap Singh <npsingh@umd.edu>",
  "Rob Patro <rob@cs.umd.edu>",
]
name = "alevin-fry"
version = "0.17.1"
edition = "2024"

description = "A suite of tools for the rapid, accurate and memory-frugal processing single-cell and single-nucleus sequencing data."
license-file = "LICENSE"
readme = "README.md"
repository = "https://github.com/COMBINE-lab/alevin-fry"
homepage = "https://github.com/COMBINE-lab/alevin-fry"
documentation = "https://alevin-fry.readthedocs.io/en/latest/"
include = [
  "/src/*.rs",
  "/src/atac/*.rs",
  "/Cargo.toml",
  "/README.md",
  "/LICENSE",
  "/CONTRIBUTING.md",
  "/CODE_OF_CONDUCT.md",
]
keywords = [
  "single-cell",
  "preprocessing",
  "RNA-seq",
  "ATAC-seq",
  "single-nucleus",
]
categories = ["command-line-utilities", "science"]

[dependencies]
libradicl = { version = "0.17.0", git = "https://github.com/COMBINE-lab/libradicl.git", rev = "195cd1d81b87bc291e677103aa5ebe84984782cf" }
anyhow = "1.0.102"
arrayvec = "0.7.6"
ahash = "0.8.12"
bincode = "1.3.3"
bstr = "1.12.1"
crossbeam-channel = "0.5.15"
crossbeam-queue = "0.3.12"
typed-builder = "0.23.2"
indicatif = "0.18.4"
# only `needletail::bitkmer` is used, for 2-bit packing barcodes and UMIs. The
# default `compression` feature exists for reading compressed FASTX, which this
# crate never does, and it pulls bzip2 and liblzma (both of which build C code)
# plus a second zstd and flate2 into the tree.
needletail = { version = "0.6.3", default-features = false }
petgraph = "0.8.3"
libdeflater = "1.25.2"
niffler = { version = "3.0.0", default-features = false, features = ["gz"] }
# zlib-rs is the pure-Rust backend: no cmake or C toolchain, and it is what
# piscem-rs and noodles-bgzf already pull in, so this collapses what used to be
# two zlib implementations in one binary down to one.
flate2 = { version = "1.1.9", default-features = false, features = ["zlib-rs"] }
scroll = "0.13.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sprs = "0.11.4"
slog = "2.8.2"
slog-term = "2.9.2"
slog-async = "2.8.0"
smallvec = "1.15.1"
snap = "1.1.1"
rand = { version = "0.10" }
chrono = "0.4.44"
csv = "1.4.0"
mimalloc = { version = "0.1.48", default-features = false }
num-format = "0.4.4"
bio-types = { version = "1.0.4", default-features = true, features = ["serde"] }
itertools = "0.15.0"
thiserror = "2.0.18"
# no shenanigans; clap makes breaking "fixes" too often to allow variability
# in the version different from what we tested with
clap = { version = "4.6.0", features = [
  "derive",
  "wrap_help",
  "cargo",
  "help",
  "usage",
  "string",
  "error-context",
] }

# libradicl 0.17 depends on noodles 0.115; a mismatch here yields two
# incompatible `sam::Header` types at the `RadHeader::from_bam_header` call in
# src/convert.rs. Keep these in lockstep.
noodles = { version = "0.115.0", features = ["bam", "bgzf", "sam"] }
dashmap = { version = "6.1.0", features = ["serde", "inline"] }
rand_distr = "0.6"

[dev-dependencies]
tempfile = "3"
slog-term = "2.9.2"

[profile.release]
#debug = true
lto = "thin"
# alevin-fry is a batch CLI and has no panic-recovery boundary. Abort instead
# of unwinding in release binaries; Cargo does not apply this release setting
# to the test and benchmark profiles.
panic = "abort"
#codegen-units=1
opt-level = 3

# The profile that 'cargo dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
